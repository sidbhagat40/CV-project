[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xdssl"
version = "0.1.0"
description = "Cross-domain self-supervised pretraining for robust autonomous-driving perception"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "opencv-python",
    "omegaconf>=2.3",
    "pycocotools",
    "matplotlib",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
imagenet = ["timm>=0.9"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
