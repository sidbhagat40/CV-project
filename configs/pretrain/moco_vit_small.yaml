# MoCo v3 contrastive pretraining (ablation vs MAE). pair_mode=temporal uses a nearby frame of the same drive
# as the positive view; it only has an effect when the pool contains several frames per sequence
# (nuScenes / Waymo / BDD video frames, not BDD keyframes).
_base_: mae_vit_small.yaml
method: moco

data:
  crop_scale: [0.08, 1.0]

moco:
  dim: 256
  mlp_dim: 4096
  temperature: 0.2
  momentum: 0.99
  pair_mode: temporal      # same | temporal
  max_dt_ms: 2000

optim:
  batch_size: 64
  grad_accum: 1
  blr: 1.5e-4
  weight_decay: 0.1
  betas: [0.9, 0.999]
  clip_grad: 1.0
