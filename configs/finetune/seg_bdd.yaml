# Full fine-tuning for semantic segmentation on BDD100K sem_seg (7K train images), evaluated cross-domain.
_base_: ../eval/seg_targets.yaml
task: seg
seed: 0
output_dir: ${paths.runs_root}/finetune/manual_seg
log_every: 50
meta: {}

model:
  arch: vit_small
  init: imagenet           # random | imagenet | ssl
  ckpt: null               # pretrain final.pt when init=ssl
  head: fpn                # fpn | linear
  freeze_backbone: false
  drop_path: 0.1

data:
  train: ${paths.labeled_root}/seg/bdd_seg_train.jsonl
  train_filter: null
  label_fraction: 1.0
  subset_seed: 0           # fixed: every init sees the identical labeled subset
  crop_size: [512, 512]
  base_short: 512
  scale_range: [0.5, 2.0]
  num_workers: 4

optim:
  batch_size: 8
  grad_accum: 1
  total_steps: 16000
  warmup_steps: 1500
  lr: 1.0e-4
  layer_decay: 0.65
  head_lr_mult: 1.0
  weight_decay: 0.05
  amp: bf16
  clip_grad: null
