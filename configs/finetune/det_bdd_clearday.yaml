# Faster R-CNN fine-tuning on BDD100K *clear daytime* images only (vehicle + pedestrian),
# then evaluation on night / rain / snow / fog BDD slices and on nuImages / Waymo.
_base_: ../eval/det_targets.yaml
task: det
seed: 0
output_dir: ${paths.runs_root}/finetune/manual_det
log_every: 50
meta: {}

model:
  arch: vit_small
  init: imagenet
  ckpt: null
  freeze_backbone: false
  drop_path: 0.1

data:
  train: ${paths.labeled_root}/det/bdd_det_train.jsonl
  train_filter: {weather: clear, timeofday: day}
  label_fraction: 1.0
  subset_seed: 0
  min_size: 576
  max_size: 1024
  num_workers: 4

optim:
  batch_size: 4
  grad_accum: 1
  total_steps: 20000
  warmup_steps: 1000
  lr: 1.0e-4
  layer_decay: 0.7
  head_lr_mult: 1.0
  weight_decay: 0.05
  amp: bf16
  clip_grad: 5.0
