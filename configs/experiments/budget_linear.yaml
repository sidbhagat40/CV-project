# 15-hour-budget variant of E1 (BDD-only pools, 4 GB GPU): 2 pools x 12k MAE steps (effective batch 128), then linear probes.
name: budget_linear
baselines: [random, imagenet]
pretrain:
  config: configs/pretrain/mae_vit_small.yaml
  pools: [bdd_clearday, bdd_mixed]
  overrides: [optim.batch_size=64, optim.grad_accum=2, optim.total_steps=12000, optim.warmup_steps=600,
              data.num_workers=8, ckpt_every=1000]
finetune:
  configs: [configs/finetune/seg_bdd_linear.yaml]
  label_fractions: [1.0]
  seeds: [0]
  overrides: [data.num_workers=6]
