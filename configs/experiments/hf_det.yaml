# Time-boxed study on the BDD100K-val mirror: narrow (clear day) vs condition-diverse pool, equal size and compute.
name: hf_det
baselines: [random, imagenet]
pretrain:
  config: configs/pretrain/mae_vit_small.yaml
  pools: [hf_clearday, hf_mixed]
  overrides: [optim.batch_size=64, optim.grad_accum=2, optim.total_steps=8000, optim.warmup_steps=400,
              data.num_workers=8, ckpt_every=1000]
finetune:
  configs: [configs/finetune/det_hf.yaml]
  label_fractions: [1.0]
  seeds: [0, 1]
  overrides: []
