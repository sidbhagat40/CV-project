# Full segmentation fine-tune for the budget run (shares pretrained checkpoints with budget_linear). Batch 4 x accum 2
# keeps the effective batch of 8 on a 4 GB GPU.
name: budget_fpn
baselines: [random, imagenet]
pretrain:
  config: configs/pretrain/mae_vit_small.yaml
  pools: [bdd_clearday, bdd_mixed]
  overrides: [optim.batch_size=64, optim.grad_accum=2, optim.total_steps=12000, optim.warmup_steps=600,
              data.num_workers=8, ckpt_every=1000]
finetune:
  configs: [configs/finetune/seg_bdd.yaml]
  label_fractions: [1.0]
  seeds: [0]
  overrides: [optim.batch_size=4, optim.grad_accum=2, optim.total_steps=5000, optim.warmup_steps=400,
              data.num_workers=6]
